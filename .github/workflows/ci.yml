name: NOBI checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: npm run cap:check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - run: bash gradlew assembleDebug :nobi-photo-library:lintDebug
        working-directory: android
  ios:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx cap sync ios
      - name: Prepare isolated simulator and synthetic library
        run: |
          mkdir -p artifacts
          xcodebuild -version
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for v in d["devices"].values() for x in v if x["name"].startswith("iPhone")))')
          echo "NOBI_SIM_UDID=$DEVICE" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          node scripts/generate-ios-fixtures.mjs
          xcrun simctl addmedia "$DEVICE" artifacts/ios-fixtures/*.png
      - name: Build native app and UI tests
        run: |
          set -euo pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme Nobi -configuration Debug -destination "platform=iOS Simulator,id=$NOBI_SIM_UDID" -derivedDataPath ios/DerivedData CODE_SIGNING_ALLOWED=NO build-for-testing | tee artifacts/ios-build.log
          ditto -c -k --keepParent ios/DerivedData/Build/Products/Debug-iphonesimulator/App.app artifacts/NOBI-Photos-ios-simulator.zip
          xcrun simctl install "$NOBI_SIM_UDID" ios/DerivedData/Build/Products/Debug-iphonesimulator/App.app
          xcrun simctl privacy "$NOBI_SIM_UDID" grant photos app.nobi.photos
      - name: Validate real PhotoKit, SQLite, Vision and app UI
        run: |
          set -euo pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme Nobi -configuration Debug -destination "platform=iOS Simulator,id=$NOBI_SIM_UDID" -derivedDataPath ios/DerivedData -parallel-testing-enabled NO -resultBundlePath artifacts/ios-ui.xcresult CODE_SIGNING_ALLOWED=NO test-without-building | tee artifacts/ios-test.log
      - name: Archive unsigned arm64 device app
        run: |
          set -euo pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme Nobi -configuration Release -destination 'generic/platform=iOS' -archivePath artifacts/NOBI-Photos.xcarchive CODE_SIGNING_ALLOWED=NO archive | tee artifacts/ios-device-build.log
          ditto -c -k --keepParent artifacts/NOBI-Photos.xcarchive artifacts/NOBI-Photos-ios-unsigned-archive.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-simulator-and-validation
          path: |
            artifacts/NOBI-Photos-ios-simulator.zip
            artifacts/NOBI-Photos-ios-unsigned-archive.zip
            artifacts/ios-build.log
            artifacts/ios-device-build.log
            artifacts/ios-test.log
            artifacts/ios-ui.xcresult
