server {
    listen 80;
    server_name photos.nobistudio.com;
    access_log off;
    client_max_body_size 16k;
    location ^~ /.well-known/acme-challenge/ { root /var/www/nobi-photos-acme; }
    location = /health { proxy_pass http://127.0.0.1:15433; proxy_set_header X-Nobi-Staging-Key ""; }
    location / { return 503; }
}
