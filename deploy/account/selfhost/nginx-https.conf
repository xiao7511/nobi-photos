server {
    listen 80;
    server_name photos.nobistudio.com;
    access_log off;
    location ^~ /.well-known/acme-challenge/ { root /var/www/nobi-photos-acme; }
    location / { return 308 https://photos.nobistudio.com$request_uri; }
}
server {
    listen 443 ssl;
    server_name photos.nobistudio.com;
    ssl_certificate /etc/letsencrypt/live/photos.nobistudio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/photos.nobistudio.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    access_log off;
    client_max_body_size 16k;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    location = /health {
        proxy_pass http://127.0.0.1:15433;
        proxy_set_header X-Nobi-Staging-Key "";
    }
    location ~ ^/(auth/v1/(signup|token|verify|logout|recover|resend|user)|rest/v1/rpc/nobi_member_access|functions/v1/nobi-delete-account)$ {
        proxy_pass http://127.0.0.1:15433;
        proxy_set_header X-Nobi-Staging-Key "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 25s;
    }
    location / { return 503; }
}
